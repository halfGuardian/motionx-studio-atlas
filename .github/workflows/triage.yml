name: Triage discovery observations
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      discovery_run:
        description: 'Completed main-branch discovery run ID'
        type: string
        default: '42149794259'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original discovery queue inside GitHub
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: halfGuardian/motionx-studio-atlas
          run-id: ${{ inputs.discovery_run || '42149794259' }}
          name: studio-discovery
          path: discovery-input
      - name: Classify without approving or publishing
        run: |
          python tools/triage.py --queue discovery-input/queue.json --report discovery-input/report.json --output triage-output --inventory
          cat triage-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-discovery-triage
          path: triage-output/
          retention-days: 90
