name: Licensed global bulk acquisition
on:
  pull_request:
    branches: [main]
    paths: ['tools/bulk*.py', 'data/bulk/**', '.github/workflows/bulk-acquisition.yml', 'tests/test_bulk*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: licensed-bulk-${{ github.event.pull_request.number || 'manual' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: bulk-run
          key: bulk-snapshots-${{ hashFiles('tools/bulk_collect.py', 'data/bulk/sources.json') }}-${{ github.run_id }}
          restore-keys: bulk-snapshots-${{ hashFiles('tools/bulk_collect.py', 'data/bulk/sources.json') }}-
      - name: Collect approved API metadata, never canonical records
        run: python tools/bulk_collect.py --output bulk-run
      - name: Prepare research ledger and coverage report when available
        run: |
          if [ -f tools/bulk_ingest.py ]; then python tools/bulk_ingest.py --input bulk-run --output bulk-review; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-bulk-research
          path: |
            bulk-run/
            bulk-review/
          retention-days: 90
