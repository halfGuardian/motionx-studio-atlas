name: Licensed global bulk acquisition
on:
  pull_request:
    branches: [main]
    paths: ['tools/bulk*.py', 'data/bulk/**', '.github/workflows/bulk-acquisition.yml', 'tests/test_bulk*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: licensed-bulk-${{ github.event.pull_request.number || 'manual' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: bulk-run
          key: bulk-snapshots-overture-2026-10-21.0-${{ github.run_id }}
          restore-keys: |
            bulk-snapshots-overture-2026-10-21.0-
            bulk-snapshots-${{ hashFiles('tools/bulk_collect.py', 'data/bulk/sources.json') }}-
      - run: pip install duckdb==1.4.3
        if: github.event_name == 'workflow_dispatch'
      - name: Collect approved API metadata, never canonical records
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/bulk_collect.py --output bulk-run
          python tools/bulk_overture.py --output bulk-run
      - name: Restore the complete licensed archive for read-only PR checks
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from discovery import read
          from bulk_archive import restore
          archive = Path(read('data/bulk/release.json')['snapshot_archive'])
          if archive.is_absolute() or '..' in archive.parts or archive.parts[:3] != ('data', 'bulk', 'runs'):
              raise ValueError('unapproved source archive path')
          restore(archive, Path('bulk-restored'))
          PY
          mkdir -p bulk-run
          mv bulk-restored/snapshots bulk-redistributable
      - name: Project manually collected source metadata
        if: github.event_name == 'workflow_dispatch'
        run: python tools/bulk_snapshot.py bulk-run --output bulk-redistributable
      - name: Prepare research ledger and coverage report when available
        run: |
          python tools/bulk_ingest.py --input bulk-redistributable --output bulk-review --ledger bulk-run/research-public.sqlite
      - name: Create immutable research archive (never public studio data)
        if: always()
        run: python tools/bulk_archive.py archive --snapshots bulk-redistributable --review bulk-review --output bulk-archive --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-bulk-research
          path: |
            bulk-review/
            data/bulk/LICENSES/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-bulk-snapshots
          path: |
            bulk-run/**
            !bulk-run/research.sqlite
            !bulk-run/research-public.sqlite
            bulk-redistributable/**
            data/bulk/LICENSES/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-bulk-durable-archive
          path: |
            bulk-archive/
            data/bulk/LICENSES/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-bulk-public-ledger
          path: |
            bulk-run/research-public.sqlite
            data/bulk/LICENSES/
          retention-days: 90
