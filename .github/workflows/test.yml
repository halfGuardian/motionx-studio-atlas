name: Validate public atlas
on:
  pull_request:
    branches: [main, codex/v1.5-nz-census-wave1, codex/global-discovery-visibility]
permissions:
  contents: read
concurrency:
  group: atlas-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.js
      - run: python tools/validate.py studios.json
      - name: Reproduce source-listed catalogue and preserve reviewed baseline
        run: if [ -f data/bulk/release.json ]; then python tools/check_bulk_release.py; fi
      - name: Reproduce advisory queue and licensing audit without granting approval
        run: if [ -f data/bulk/reports/licensing.json ]; then python tools/launch_readiness.py check --output data/global-programme/reports/readiness; fi
      - name: Reproduce boutique matching, benchmark and pending research proposals
        run: python tools/boutique.py check --output data/boutique/reports
      - name: Reproduce complete Annecy reconciliation and pending human review
        run: python tools/annecy.py check
      - name: Retain frozen Wave 1 audit against its original 42,239-record baseline
        run: python tools/nz_census.py prepare --output /tmp/nz-wave1-reports
      - name: Validate complete NZ continuation and unchanged historical data
        run: python tools/nz_research.py check
      - name: Audit every company-only geography without changing parent records
        run: python tools/global_visibility.py check
      - name: Check company proposals, preserved backlog and reversible scope exclusions
        run: python tools/global_continuation.py check
      - name: Reproduce global source coverage, full identity outcomes and pending review
        run: python tools/global_programme.py check
      - name: Check actual permitted snapshot continuity and repeat-import idempotency
        run: python tools/global_programme.py maintenance-check
      - name: Reproduce NZ final relevance, rights, staging and pending maintainer review
        run: python tools/nz_quality_gate.py check
      - name: Validate the actual integrated draft and scoped current licensing audit
        run: |
          python tools/release_candidate.py check
          python tools/map_gate.py check
          python tools/launch_readiness.py check --output data/release-candidate/reports/readiness
      - name: Package the integrated release decisions and complete static atlas
        run: |
          python tools/package_release_candidate.py --output "$RUNNER_TEMP/release-decisions" --review-only
          python tools/package_release_candidate.py --output "$RUNNER_TEMP/release-atlas"
      - uses: actions/upload-artifact@v4
        with:
          name: global-release-candidate-decisions
          path: ${{ runner.temp }}/release-decisions/
      - uses: actions/upload-artifact@v4
        with:
          name: global-release-candidate-static-atlas
          path: ${{ runner.temp }}/release-atlas/
      - name: Package the global review with working relative paths
        run: python tools/package_global_review.py --output "$RUNNER_TEMP/global-programme-bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: global-programme-pending-human-review
          path: ${{ runner.temp }}/global-programme-bundle/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nz-census-reconciliation-and-pending-human-review
          path: |
            data/nz-census
            nz-review.js
            nz-final-review.js
      - uses: actions/upload-artifact@v4
        with:
          name: annecy-2024-coverage-and-human-review
          path: |
            data/annecy/reports
            data/annecy/inputs/input-receipt.json
            data/annecy/source-policy.json
            data/annecy/README.md
            data/annecy/validation.md
            data/annecy/review-enforcement.json
            data/annecy/qa
      - uses: actions/upload-artifact@v4
        with:
          name: boutique-discovery-review-and-coverage
          path: |
            data/boutique/reports
            data/boutique/sources.json
            data/boutique/query-log.json
            data/boutique/collection-attempt.json
            data/boutique/README.md
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - name: Use runner Chrome, or install Playwright Chromium if absent
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM=$browser_path" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python tests/browser_smoke.py
      - run: python tests/bulk_browser.py
      - name: Actual source-listed public catalogue over HTTP
        run: if [ -f data/public/manifest.json ]; then python tests/public_catalog_smoke.py; fi
      - name: Actual company-reference geography, filters and coincident selection
        run: python tests/global_visibility_browser.py
      - name: Audience eligibility, reversible audio scope, evidence exports and mobile
        run: python tests/commercial_browser.py
      - name: Integrated release-candidate companies, taxonomy, geography and exports
        run: python tests/release_candidate_browser.py
      - name: Final admitted-company map and unpinned-directory acceptance
        run: |
          python tools/package_release_candidate.py --output "$RUNNER_TEMP/map-gate-atlas"
          MOTIONX_MAP_GATE_ROOT="$RUNNER_TEMP/map-gate-atlas" python tests/map_gate_browser.py
      - name: Actual standalone company and branch review artifact
        run: |
          python tools/package_global_review.py --output "$RUNNER_TEMP/continuation-review-browser"
          MOTIONX_REVIEW_ROOT="$RUNNER_TEMP/continuation-review-browser" python tests/continuation_package_browser.py
      - name: Global coverage dashboard, safe review export and missing-report handling
        run: python tests/global_review_browser.py
      - name: Evidence colours, mixed clusters, research review and launch readiness
        run: python tests/unified_ux.py
      - name: Actual boutique view, seed identities and safe research exports
        run: python tests/boutique_browser.py
      - name: NZ coverage, provisional references and source-specific licence export
        run: python tests/nz_census_browser.py
      - name: NZ final review worksheet, staging, public assertions and safe exports
        run: python tests/nz_quality_browser.py
      - name: Annecy coverage dashboard and actual company references
        run: python tests/annecy_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-browser-and-50000-location-performance
          path: |
            /tmp/motionx-v10-performance.json
            /tmp/motionx-v11-bulk-performance.json
            /tmp/motionx-v11-real-performance.json
            /tmp/motionx-v11-ux-performance.json
            /tmp/motionx-v11-*.png
            /tmp/motionx-v12-*.png
            /tmp/motionx-v12-*.json
            /tmp/motionx-v13-*.json
            /tmp/motionx-v13-*.png
            /tmp/motionx-v15-*.json
            /tmp/motionx-v15-*.png
            /tmp/motionx-global-*.json
            /tmp/motionx-rc-*.json
            /tmp/motionx-map-gate-*.json
            data/global-programme
            geography.js
            data/bulk/reports/licensing.html
            data/bulk/reports/licensing.json
            data/bulk/reports/review-queue.json
            /tmp/motionx-v08-desktop.png
            /tmp/motionx-v08-mobile.png
